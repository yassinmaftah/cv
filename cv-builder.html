<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My CV Builder</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#dde1e8;--ac:#2f4a7d;--inp:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--panel:#1d222b;--tx:#e8ebf1;--mut:#9aa3b5;--bd:#2f3644;--ac:#7ea2e6;--inp:#262c38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171d;--panel:#1d222b;--tx:#e8ebf1;--mut:#9aa3b5;--bd:#2f3644;--ac:#7ea2e6;--inp:#262c38;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
:root[data-theme="dark"] button.pri,:root:not([data-theme="light"]) button.pri{color:#111}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
input,textarea,select{background:var(--inp);border:1px solid var(--bd);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.lbl-row{display:flex;justify-content:space-between;align-items:center;margin:8px 0 3px}
.lbl-row label{margin:0}
.sp{flex:1}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:640px){.g2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center}
.item{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border-top:1px solid var(--bd);padding:8px 0}
.item small{color:var(--mut)}
.ph{width:72px;height:72px;border-radius:0;object-fit:cover;background:var(--bd)}

.btn-xs{background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:2px 7px;font-size:11px;cursor:pointer;color:var(--mut);line-height:1.2}
.btn-xs:hover{border-color:var(--ac);color:var(--ac)}

.badge-missing{background:#fff3cd;color:#856404;border:1px solid #ffeeba;border-radius:3px;padding:1px 5px;font-size:10px;font-weight:600;margin-left:6px;white-space:nowrap;display:inline-block}
:root[data-theme="dark"] .badge-missing{background:#3a3010;color:#ffd966;border-color:#5c4810}
.badge-lang{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:3px;padding:1px 5px;font-size:10px;font-weight:700;margin-left:4px;text-transform:uppercase}

/* builder layout */
#build{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 54px)}
@media(max-width:800px){#build{grid-template-columns:1fr;height:auto}}
#left{overflow:auto;padding:12px;border-right:1px solid var(--bd);background:var(--panel)}
#right{overflow:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:12px 0 4px}
.src{display:flex;gap:8px;justify-content:space-between;align-items:center;border:1px solid var(--bd);border-radius:8px;padding:6px 8px;margin-bottom:5px}
.src.used{opacity:.5}
.src-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;flex:1;min-width:0}
.src-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%;max-width:794px}
.tool input[type=text]{flex:1;min-width:140px}
.tool input[type=color]{width:38px;padding:2px;height:34px}
#pagebox{flex:none;position:relative}
#page{transform-origin:top left}
#page{width:794px;min-height:1123px;background:#fff;color:#1a1a1a;padding:44px 48px;box-shadow:0 2px 14px rgba(0,0,0,.25);font:12.5px/1.45 Calibri,Arial,sans-serif}
#page h1{margin:0;font-size:26px;color:var(--cvac)}
#page .hl{font-size:14px;color:#444;margin-top:2px}

/* Contact line */
#page .ct{font-size:11.5px;color:#333;margin-top:7px;display:flex;flex-wrap:wrap;align-items:center;line-height:1.4}
#page .ct-item{display:inline-flex;align-items:center;color:#333;text-decoration:none;white-space:nowrap}
#page a.ct-item{color:#333;text-decoration:none}
#page a.ct-item:hover{text-decoration:underline}
#page .ct-sep{margin:0 7px;color:#888;font-size:10px}
#page .ct-ico{width:12px;height:12px;margin-right:4px;vertical-align:-1.5px;flex-shrink:0;fill:currentColor}

/* Linked GitHub portfolio count in the printed CV and on-screen preview. */
#page h3 .project-count-link{color:inherit;text-decoration:none;display:inline-flex;align-items:baseline;gap:7px}
#page h3 .project-count-link:hover{text-decoration:underline}
#page h3 .project-count{font-size:.85em;font-weight:700;letter-spacing:0;opacity:.85}
/* CV Sections & Items */
#page h3{margin:14px 0 6px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--cvac,#1d2330);border-bottom:1.5px solid var(--cvac,#1d2330);padding-bottom:2px}
#page .it{position:relative;margin-bottom:8px}
#page .cert-item{font-size:12px;line-height:1.45;margin-bottom:4px;break-inside:avoid;overflow-wrap:anywhere}
#page .cert-item .t{font-size:inherit}
#page .it-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#page .t{font-weight:700;font-size:13px}
#page .t a{color:#1a1a1a;text-decoration:underline;text-decoration-color:var(--cvac)}
#page .d{font-size:11.5px;font-weight:600;color:#555;white-space:nowrap;margin-left:auto;text-align:right}
#page .s{color:#555;font-size:11.5px;margin-top:1px}
#page ul{margin:2px 0 0;padding-left:18px}
#page p{margin:2px 0 0}
#page .top{display:flex;justify-content:space-between;gap:16px;align-items:center}
#page .top img{width:92px;height:92px;border-radius:0;object-fit:cover}

/* 2-column technologies layout */
#page .tech-cols{columns:2;column-gap:24px;margin-bottom:4px}
#page .tech-item{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;display:block;margin-bottom:6px;font-size:12px;line-height:1.45;position:relative}
#page .tech-item b{color:#111;font-weight:700}

/* Left panel collapsible groups */
.grp-wrap{margin-bottom:8px}
.grp-hdr{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;color:var(--tx);text-align:left}
.grp-hdr:hover{border-color:var(--ac)}
.grp-ind{font-size:14px;font-weight:700;color:var(--mut)}
.grp-body{padding-top:6px;display:flex;flex-direction:column;gap:5px}

.ctl{position:absolute;right:0;top:0;display:none;gap:3px;z-index:2}
.it:hover .ctl{display:flex}
.ctl button{padding:1px 7px;font-size:12px;background:#fff;color:#222;border-color:#bbb}
.empty{color:#999;text-align:center;margin-top:120px}

#fitStatus{width:100%;max-width:794px;font-size:12px;color:var(--mut)}
#fitStatus[data-overflow="true"]{font-weight:600;color:var(--tx)}
#printWarning{display:none}
button:disabled{opacity:.5;cursor:not-allowed}
#page[data-measure] .ctl,#page[data-measure] .empty{display:none!important}

@media print{
 @page{size:A4;margin:0}
 html,body{margin:0!important;padding:0!important;background:#fff!important;height:auto!important;overflow:visible!important}
 body>header,#left,.tool,#fitStatus,.ctl,.empty{display:none!important}
 #view,#build,#right,#pagebox{display:block!important;width:auto!important;height:auto!important;min-height:0!important;max-height:none!important;margin:0!important;padding:0!important;overflow:visible!important;transform:none!important;background:none!important}
 #page{position:static!important;width:210mm!important;min-height:0!important;height:auto!important;margin:0!important;padding:12mm 14mm!important;transform:none!important;box-shadow:none!important;overflow:visible!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 #pagebox[data-overflow="true"] #page{display:none!important}
 #pagebox[data-overflow="true"] #printWarning{display:block;padding:15mm;font:12pt Arial,sans-serif;color:#111}
}
</style>

function extractUser(u){
 if(!u)return'';
 let clean=String(u).split(/[?#]/)[0].replace(/\/+$/,'');
 const parts=clean.split('/').filter(Boolean);
 return parts.length?parts[parts.length-1]:clean;
}

function normalizeState(){
 if(!S||!S.profile)S=seed();
 if(!S.profile.headline)S.profile.headline={en:'Full-Stack Developer',fr:'Développeur Full Stack'};
 else S.profile.headline=normBi(S.profile.headline);
 if(S.profile.langs!=null)S.profile.langs=normBi(S.profile.langs);
 if(S.items){
  S.items.forEach(i=>{
   if(i.type==='skills')i.type='technologies';
   if(i.date==null)i.date='';
   i.title=normBi(i.title);
   i.sub=normBi(i.sub);
   i.text=normBi(i.text);
  });
 }
 if(S.cvs){
  S.cvs.forEach(c=>{
   if(!c.lang)c.lang='en';
    c.headline=normBi(c.headline);
  });
 }
}

function load(){
 try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 normalizeState();
}

function saveTech(){
 const title={en:$('#techCatEn').value.trim(),fr:$('#techCatFr').value.trim()};
 const text={en:$('#techListEn').value.trim(),fr:$('#techListFr').value.trim()};
 if(!title.en&&!title.fr){alert('Please write a category title');return}
 if(!title.en)title.en=title.fr;
 if(!title.fr)title.fr=title.en;
 if(!text.en)text.en=text.fr;
 if(!text.fr)text.fr=text.en;

 if(editingTech){
  const item=S.items.find(i=>i.id===editingTech);
  if(item){item.title=title;item.text=text}
 }else{
  S.items.push({id:uid(),type:'technologies',title,text,link:'',sub:{en:'',fr:''},date:''});
 }
 save();clearTech();list();
}

function saveItem(){
 const title={en:$('#ftiEn').value.trim(),fr:$('#ftiFr').value.trim()};
 if(!title.en&&!title.fr){alert('Please write a title');return}
 const cert=$('#ft').value==='certificate';
 const o={
  type:$('#ft').value,
  date:cert?'':$('#fdt').value.trim(),
  link:$('#fl').value.trim(),
  title,
  sub:cert?{en:'',fr:''}:{en:$('#fsEn').value.trim(),fr:$('#fsFr').value.trim()},
  text:{en:$('#fxEn').value.trim(),fr:$('#fxFr').value.trim()}
 };
 if(editing)Object.assign(S.items.find(i=>i.id===editing),o);
 else S.items.push({id:uid(),...o});
 save();clearForm();list();
}

   }else{
    a.forEach(i=>{
     const u=c.ids.includes(i.id);

     const missBadge=miss?`<span class="badge-missing">missing ${l.toUpperCase()}</span>`:'';
     h+=`<div class="src ${u?'used':''}">

      <button data-id="${i.id}">${u?'Remove':'+ Add'}</button>

    });

   h+=`</div>`;
  }

function fmt(t){if(!t)return'';const L=t.split('\n').filter(x=>x.trim());let h='',ul=false;L.forEach(l=>{if(/^\s*[-•]\s+/.test(l)){if(!ul){h+='<ul>';ul=true}h+='<li>'+esc(l.replace(/^\s*[-•]\s+/,''))+'</li>'}else{if(ul){h+='</ul>';ul=false}h+='<p>'+esc(l)+'</p>'}});return h+(ul?'</ul>':'')}

function page(){

 const l=c.lang||'en';
 pg.style.setProperty('--cvac',c.accent);

// Keep the original preview and print typography. Measure at the exact original
// A4 print width and padding, and reject overflow rather than scaling the PDF.
function measureFit(){
 const pg=$('#page'),b=$('#pagebox');
 if(!pg||!b)return false;
 const sample=pg.cloneNode(true);
 sample.setAttribute('data-measure','');
 sample.setAttribute('aria-hidden','true');
 sample.style.cssText='position:absolute!important;display:block!important;left:-20000px!important;top:0!important;transform:none!important;box-shadow:none!important;width:210mm!important;min-height:0!important;height:auto!important;margin:0!important;padding:12mm 14mm!important;overflow:visible!important;visibility:hidden!important;';
 document.body.appendChild(sample);
 const height=sample.getBoundingClientRect().height;
 sample.remove();
 const limit=(297-3)*96/25.4;
 const fits=height>0&&height<=limit;
 b.dataset.overflow=String(!fits);
 const pdf=$('#pdf'),status=$('#fitStatus');
 if(pdf)pdf.disabled=!fits;
 if(status){
  status.dataset.overflow=String(!fits);
  status.textContent=fits?'Fits on 1 A4 page':'Exceeds one A4 page by about '+Math.max(0,Math.ceil((height-limit)*25.4/96))+' mm. Shorten your CV to enable PDF export.';
 }
 return fits;
}
function fit(){
 const b=$('#pagebox'),pg=$('#page'),right=$('#right');
 if(!b||!pg||!right)return;
 pg.style.transform='none';
 const k=Math.min(1,Math.max(1,right.clientWidth-24)/pg.offsetWidth);
 b.style.width=pg.offsetWidth*k+'px';
 b.style.height=pg.offsetHeight*k+'px';
 pg.style.transform='scale('+k+')';
 measureFit();
}
addEventListener('resize',fit);
addEventListener('beforeprint',measureFit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

const PROJECT_TRANSLATIONS={"proj-allomaalem":{"title":"Allo Maalem","sub":"Laravel 12, PHP 8.2, MySQL 8.0, Tailwind CSS, API Stripe, Docker","text":"- Développement de portails par rôle pour les clients et les artisans avec middleware personnalisé et gestion des quotas mensuels.\n- Mise en place d'un processus d'attribution des propositions sécurisé contre les accès concurrents grâce aux transactions en base de données.\n- Intégration de l'API Stripe pour les abonnements à plusieurs niveaux et la facturation automatique des artisans."},"proj-brainscan":{"title":"BrainScan AI","sub":"Python 3.11, TensorFlow 2.17, Streamlit, Docker, OpenCV, Scikit-learn","text":"- Développement d'un CNN personnalisé à trois blocs pour classer quatre catégories d'IRM cérébrales, avec une précision de 96,51 % sur un jeu de test de 7 023 images.\n- Mise en place d'un mécanisme de triage utilisant un seuil de confiance de 70 % pour signaler les cas ambigus nécessitant une vérification.\n- Conteneurisation de l'interface Streamlit et du laboratoire Jupyter avec une architecture Docker Compose multi-services."},"proj-deliveryeta":{"title":"DeliveryETA","sub":"Python 3.12, Scikit-learn, Streamlit, Pandas, NumPy, Docker","text":"- Création de variables géospatiales à partir de la formule de Haversine et calcul du temps de préparation avec gestion du passage à minuit.\n- Entraînement et optimisation d'un modèle Random Forest atteignant un R² de 0,764 et une erreur absolue moyenne de 3,53 minutes, avec validation croisée à cinq plis.\n- Déploiement d'une application Streamlit utilisant un ColumnTransformer commun pour éviter les fuites de données."},"proj-diabetes-mlops":{"title":"Diabetes Risk MLOps","sub":"Python, Scikit-learn, FastAPI, Streamlit, MLflow, Apache Airflow, Docker","text":"- Construction d'un pipeline de machine learning combinant imputation KNN, clustering K-Means et régression logistique.\n- Orchestration du réentraînement automatique avec Apache Airflow et suivi des expériences via le registre de modèles MLflow.\n- Conteneurisation d'un microservice d'inférence FastAPI avec validation Pydantic et interface interactive Streamlit."},"proj-easycoloc":{"title":"EasyColoc","sub":"Laravel 12, PHP 8.2, Blade, Tailwind CSS, MariaDB, Docker","text":"- Automatisation du partage équitable des dépenses et du suivi des dettes bilatérales en temps réel, avec règlement en un clic.\n- Création d'un score de réputation entre colocataires et réattribution transactionnelle des dettes lors du départ d'un membre.\n- Mise en place d'un contrôle d'accès par rôles (administrateur, propriétaire, membre) et d'invitations par e-mail sécurisées par jeton."},"proj-neuroscan":{"title":"NeuroScan-AI","sub":"Python, TensorFlow, InceptionV3, YOLOv8s, FastAPI, Streamlit, MLflow, Airflow, Docker","text":"- Ajustement d'InceptionV3 pour la classification d'IRM cérébrales avec 96,3 % de précision sur le jeu de test et entraînement de YOLOv8s pour la localisation des tumeurs.\n- Automatisation de la préparation des données, de l'entraînement et de l'évaluation avec un DAG Apache Airflow de huit tâches.\n- Exposition de deux API REST via FastAPI, suivi des modèles dans MLflow et déploiement d'une interface Streamlit."},"proj-meteorisk":{"title":"s-MeteoRisk","sub":"Python 3.11, Apache Airflow, PostgreSQL 16, SQLAlchemy, Streamlit, Docker","text":"- Extraction de prévisions via l'API REST Open-Meteo et structuration des données PostgreSQL en couches Bronze, Silver et Gold.\n- Conception d'un indice de risque combinant les seuils de rafales de vent, les probabilités de pluie et les températures extrêmes.\n- Orchestration de pipelines ETL quotidiens avec Apache Airflow et visualisation des risques pour 120 villes marocaines dans Streamlit."},"proj-satas-bus":{"title":"SATAS Bus","sub":"Laravel 12, PHP 8.2, MariaDB, Tailwind CSS, Alpine.js, Dompdf, Docker","text":"- Développement d'une recherche de trajets avec correspondances entre 20 villes marocaines et calcul dynamique des tarifs par segment.\n- Application d'une limite de 50 passagers et sécurisation de l'attribution des sièges contre les réservations concurrentes.\n- Génération automatisée de billets électroniques PDF côté serveur et gestion des annulations en libre-service."},"proj-virtualworkspace":{"title":"Workspace Manager","sub":"JavaScript natif, HTML5, CSS3, LocalStorage","text":"- Développement côté client de la gestion CRUD des employés, avec validation des saisies en temps réel et persistance LocalStorage.\n- Mise en place de contraintes de capacité des salles et de filtres d'accès par rôle pour optimiser l'affectation des employés.\n- Conception d'un plan interactif affichant l'occupation et les places disponibles en temps réel."},"proj-wavepms":{"title":"WavePMS","sub":"Laravel 12, PostgreSQL, stancl/tenancy, Filament 5, Livewire 3, Tailwind CSS, Docker","text":"- Conception d'une architecture SaaS multi-tenant avec isolation des schémas PostgreSQL via stancl/tenancy.\n- Développement de huit tableaux de bord par rôle avec Filament et Livewire pour l'accueil, les moniteurs et la cuisine.\n- Intégration d'un portail client par lien magique, de la signature de décharges numériques et du suivi des retards de vol via API externes."},"proj-quranplatform":{"title":"QuranPlatform","sub":"Laravel 12, React 19, Vite 8, Tailwind CSS v4, SQLite/MySQL, Sanctum, Docker","text":"- Développement d'une API REST Laravel 12 découplée avec authentification Sanctum et d'une SPA React 19 stylisée avec Tailwind CSS v4.\n- Création d'un suivi interactif de mémorisation du Coran avec mandala de progression sur 240 Thumon et calendriers de régularité.\n- Intégration d'une bibliothèque vidéo de tafsir via YouTube oEmbed et d'une interface d'administration pour la modération."},"proj-youcode":{"title":"YouCode","sub":"Laravel 12, React 19, Vite 8, Tailwind CSS v4, Dompdf, Docker","text":"- Développement d'un pipeline de recrutement ATS de type Kanban par glisser-déposer, avec étapes personnalisables et suivi des échéances.\n- Création d'un fil interactif de quiz et de sondages avec animations de vote en temps réel et explications immédiates.\n- Mise en place d'un espace de ressources professionnelles et d'un portfolio public pour les recruteurs, avec génération de CV PDF côté serveur via Dompdf."}};
function isFullBackup(data){
 return !!data && !Array.isArray(data) && typeof data.profile==='object' &&
  Array.isArray(data.items) && Array.isArray(data.cvs);
}
function projectRows(data){
 if(Array.isArray(data))return data;
 if(data && Array.isArray(data.items))return data.items;
 throw Error('Expected a JSON array of projects or an object containing "items".');
}
function mergeItems(payload){
 const incoming=projectRows(payload);
 const valid=incoming.filter(i=>i && ['project','technologies'].includes(i.type) && typeof i.id==='string' && i.id.trim());
 if(!valid.length)throw Error('No project or technology entries in this file.');
 const unique=new Map(valid.map(i=>[i.id,i]));
 let added=0,updated=0,projects=0,technologies=0;
 for(const [id,item] of unique){
  const previous=S.items.find(i=>i.id===id);
  const known=item.type==='project'?(PROJECT_TRANSLATIONS[id]||{}):{};
  const field=(key)=>{
   const incoming=normBi(item[key]), old=normBi(previous&&previous[key]);
   const explicitFrench=item[key] && typeof item[key]==='object' && typeof item[key].fr==='string' && item[key].fr.trim();
   return {en:incoming.en||old.en,fr:explicitFrench?incoming.fr:(old.fr||known[key]||incoming.fr||'')};
  };
  const entry={id,type:item.type,date:String(item.date||previous?.date||''),
   link:String(item.link||previous?.link||''),title:field('title'),sub:field('sub'),text:field('text')};
  if(previous){Object.assign(previous,entry);updated++}else{S.items.push(entry);added++}
  if(item.type==='project')projects++;else technologies++;
 }
 // Map five original starter skills and the starter project to canonical IDs.
 const legacyIds={a1:'proj-allomaalem',t1:'tech-front-end',t2:'tech-back-end',t3:'tech-databases',t4:'tech-machine-learning',t5:'tech-mlops-deployment'};
 const legacyTitles={a1:/Allo Maalem/i,t1:/Front.End/i,t2:/Back.End/i,t3:/Databases|Bases de donn/i,t4:/Machine Learning/i,t5:/MLOps/i};
 for(const [oldId,newId] of Object.entries(legacyIds)){
  if(!unique.has(newId))continue;
  const old=S.items.find(i=>i.id===oldId);
  if(!old || !legacyTitles[oldId].test(tVal(old.title,'en')))continue;
  S.items=S.items.filter(i=>i!==old);
  S.cvs.forEach(c=>{c.ids=c.ids.map(id=>id===oldId?newId:id).filter((id,pos,a)=>a.indexOf(id)===pos)});
 }
 save();
 if(S.tab==='info')list();else viewCV();
 return {added,updated,projects,technologies};
}
function importJSON(data,onlyProjects){
 if(!onlyProjects && isFullBackup(data)){
  if(!confirm('Restore this full backup? This replaces your currently saved CVs and profile. Export a backup first if you want to keep them.'))return 'Import cancelled.';
  S=data;normalizeState();save();tab(S.tab||'info');
  return 'Full CV backup restored successfully.';
 }
 const {added,updated,projects,technologies}=mergeItems(data);
 return added+' items added and '+updated+' updated ('+projects+' projects, '+technologies+' technology categories). Existing CVs and profile preserved.';
}
function attachImport(buttonId,fileId,onlyProjects){
 $(buttonId).onclick=()=>$(fileId).click();
 $(fileId).onchange=e=>{
  const file=e.target.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
   try{alert(importJSON(JSON.parse(reader.result),onlyProjects))}
   catch(err){alert('Import failed: '+(err?.message||'Invalid JSON file'))}
   e.target.value='';
  };
  reader.onerror=()=>{alert('Could not read selected file.');e.target.value=''};
  reader.readAsText(file);
 };
}
attachImport('#impProjects','#projectFile',true);
attachImport('#imp','#impf',false);
load();tab(S.tab||'info');
</script>
